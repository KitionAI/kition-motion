    title: "The Properties panel shows the whole selected layer as collapsible sections from its property tree: its name (typed in place), type, blending mode and parent; its type's own section (Text, Contents), its effects, Transform and Masks, with the 3D-only groups hidden on a 2D layer and a text layer's Path and More Options behind More; each property has a keyframe diamond (none, animated, key here), its translated name and a control by type: numbers that type and scrub (Shift ×10, Alt ×0.1, one undo step per drag) with units and a slider where the range is known, x and y (z on a 3D layer) with Scale's proportions linked, a colour swatch whose picker opens in a popover, a drop-down with its option labels, a check box or a text field, the same controls as the timeline's twirled-open rows; with several layers selected it shows the first and says so; a text layer's Text section has its content in a box (live while typing, one undo step, Cmd+Enter or leaving it ends), a searchable font family, style, size, fill, stroke and its width, tracking, leading and alignment, and a new text layer's box takes the focus with its text selected; a shape layer of one rectangle, ellipse, polygon or star shows its size, roundness, fill colour and opacity and stroke colour and width (Add fill and Add stroke when it has none) above its whole contents in a closed group, and a solid layer its colour and size"
