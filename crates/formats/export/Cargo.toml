[package]
name = "kition-motion-export"
description = "Render Queue jobs and output modules: H.264 MP4 (+AAC) and ProRes MOV (+PCM) via Kition Film, HEVC / AV1 MP4 (+AAC) and WebM (VP9 or AV1 + Opus) via Kition Motion encoders, PNG/JPEG/TIFF/EXR sequences, animated GIF, WAV/AIFF"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
kition-motion-time = { workspace = true }
kition-motion-project = { workspace = true }
kition-motion-raster = { workspace = true }
kition-motion-render = { workspace = true }
kition-film-h264enc = { workspace = true }
kition-film-prores = { workspace = true }
kition-film-aac = { workspace = true }
kition-film-isobmff = { workspace = true }
kition-motion-opusenc = { workspace = true }
kition-motion-vp9enc = { workspace = true }
kition-motion-hevcenc = { workspace = true }
kition-motion-av1enc = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "tiff", "exr"] }
gif = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
kition-motion-media = { workspace = true }
kition-motion-effects = { workspace = true }
kition-motion-color = { workspace = true }
kition-film-opus = { workspace = true }
kition-film-vp9 = { workspace = true }
kition-motion-keyframe = { workspace = true }
