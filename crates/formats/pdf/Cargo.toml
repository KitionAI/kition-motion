[package]
name = "kition-motion-pdf"
description = "Vector footage import: PDF and PDF-compatible Illustrator (.ai) pages and EPS (a PostScript subset) parsed into the SVG render tree (paths, fills, strokes, shadings, tiling patterns, clipping, text with embedded fonts, images, blend modes, soft masks, optional-content layers)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
kition-motion-svg = { workspace = true }
kurbo = { workspace = true }
kition-motion-text = { workspace = true }
miniz_oxide = "0.8"
# Embedded TrueType / OpenType font programs (Apache-2.0).
skrifa = { workspace = true }
# DCT (JPEG) images (Apache-2.0 OR Zlib; pure Rust).
zune-jpeg = "0.5"

[dev-dependencies]
# Encodes JPEG fixtures for the DCT image test.
image = { workspace = true }
kition-motion-raster = { workspace = true }
