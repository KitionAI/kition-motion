[package]
name = "kition-motion-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
kition-motion-time = { workspace = true }
kition-motion-geom = { workspace = true }
kition-motion-keyframe = { workspace = true }
serde_json = { workspace = true }
kition-motion-project = { workspace = true }
kition-motion-path = { workspace = true }
kition-motion-render = { workspace = true }
boa_engine = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
kition-motion-color = { workspace = true }
kition-motion-effects = { workspace = true }
kition-motion-text = { workspace = true }
