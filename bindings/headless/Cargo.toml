[package]
name = "kition-motion"
description = "The Motion kit for Kition's agent: the Kition SDK document served headless over the Kit Protocol."
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
kition-motion-kit = { path = "../wasm" }
kition-headless = { workspace = true }

[dev-dependencies]
kition-kit = { workspace = true, features = ["session"] }
kition-kit-server = { workspace = true }
serde_json = { workspace = true }
# outside.rs and ids.rs drive the kit through the kits' MCP server's tools, as an agent does.
kition-kits = { workspace = true }
# file.identity and file.fork through the real process (tests/identity.rs).
kition-kit-host = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
