intent: >-
  keys.select rejects an unknown or misspelled parameter (`times`, a top-level `layer` or `path`)
  and a missing `keys` list with invalid params naming the accepted keys, instead of answering 0
  and leaving the next keyframe command disabled; `keys: []` still clears the selection.
