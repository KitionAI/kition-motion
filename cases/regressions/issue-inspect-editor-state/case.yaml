format: 1
id: regressions/issue-inspect-editor-state
feature: motion.agent.context
intent: >-
  What an agent reads of a project served headless (`view.describe`, the motion_inspect details)
  is the project, not the editing session: moving the current time or selecting layers leaves it
  unchanged, while keyframe times and the animated properties' paths stay. kition-sdk stopped
  leaving out `time`-like keys by name, so the kit declares its editor state itself
  (`EDITOR_STATE`, JSON Pointers where a name is ambiguous); the current time showed up
  undeclared.
layer: gate
tags: [headless]
