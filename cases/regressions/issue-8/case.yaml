feature: motion.agent.design
intent: >-
  The design check and inspect's design advice have no false positives: text an expression
  animates (the countUp preset) moves, so it is not static-text; contrast is measured against what
  is right behind the text when it comes on (a white card under dark text reads well), not the
  background solid; and weak-hierarchy compares only texts on screen together.
