format: 1
id: motion.agent.places/place-premise
feature: motion.agent.places
intent: >-
  A step that names a layer by stack position ("#3", or a number no layer has as its id) or acts at
  a time with no layer named answers what is under that place (context.under): the layer "#3"
  names and its window in comp.layers; for a time, the selected layers of a layer command, nothing
  for a time or view command, the comp's markers for a comp marker named by at or index, else the
  layers alive then, as a span over their In and Out points. After a colleague's layer above it, a
  write by "#3" is refused as relocated naming the layer it named and the one it names now; after
  a colleague's change of that layer's content it is refused as changed. A write by id applies
  after a move when its call does not depend on the stack (layer.rename, an opacity with no keys);
  a key at a time is refused after a change of its property or a shift of its layer. Fifty
  unrelated changes refuse no write by place under premise and every one under epoch; a mixed
  fifty-round run and ten rounds each of a rotation, a key before the time and a time stretch of
  the target print, per change and write, what applied and which refusals were necessary.
